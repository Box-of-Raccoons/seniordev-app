appId: com.boxofraccoons.seniordev
productName: SeniorDev
protocols:
  - name: SeniorDev
    schemes: [seniordev]
directories:
  buildResources: build
  output: release
# Ad-hoc code-sign the packaged macOS .app so it launches locally on Apple
# Silicon without the Gatekeeper "damaged / malware" dialog. electron-builder
# skips signing entirely when no Apple Developer ID identity is present, which
# leaves an unsigned arm64 bundle macOS refuses to run. See build/adhoc-sign.cjs
# for the full rationale and the distribution caveat (real notarization still
# needed to ship to other machines).
afterPack: build/adhoc-sign.cjs
# node-pty is rebuilt for the Electron ABI by @electron/rebuild (see the `dist`
# script) via node-gyp. electron-builder's own `npm rebuild` path instead runs
# node-pty's `build` script (`tsc -b`), which fails compiling node-pty's bundled
# test files — so disable it here and let @electron/rebuild own native rebuilds.
npmRebuild: false
files:
  - out/**
  - package.json
# Ship the default prompt library so a fresh install can seed it into the user's
# promptsDir on first run. Lands at <resourcesPath>/prompts (see bundledPromptsDir).
extraResources:
  - from: resources/prompts
    to: prompts
    filter:
      - '**/*.md'
  # Ship tray/app images so the SeniorDevWatch tray icon resolves at
  # <resourcesPath>/assets in packaged builds (see assetPath in src/watch/main.ts).
  - from: assets
    to: assets
    filter:
      - '**/*.png'
# Where electron-updater looks for new versions at runtime. Stated explicitly
# rather than left to be inferred from package.json's repository field, because
# this block is also what makes electron-builder write app-update.yml into the
# packaged app — the file the updater reads to find this feed. The repo is
# public, so the update check needs no token.
publish:
  provider: github
  owner: Box-of-Raccoons
  repo: seniordev-app
win:
  target: nsis
  icon: build/icon.png
mac:
  # zip is REQUIRED for auto-update, not a duplicate of the dmg: Squirrel.Mac can
  # only apply an update from a zip. The dmg remains the first-install download.
  target: [dmg, zip]
  category: public.app-category.developer-tools
  icon: build/icon.png
  # Real Developer ID signing + notarization for distribution (supersedes the
  # ad-hoc afterPack sign, which now self-skips when a Dev ID identity is present).
  # Hardened runtime is required for notarization; gatekeeperAssess:false lets the
  # build proceed on CI runners. Notarization uses the App Store Connect API key
  # from the APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER env vars set in
  # CI; absent creds (local dev) => electron-builder skips notarization.
  hardenedRuntime: true
  gatekeeperAssess: false
  # Notarize via the App Store Connect API key (APPLE_API_KEY / APPLE_API_KEY_ID /
  # APPLE_API_ISSUER env, set in CI). Do NOT add `teamId` here: @electron/notarize
  # treats a teamId as *password* credentials, which then collides with the API-key
  # credentials from the env ("Cannot use ... credentials at once"). `notarize: true`
  # keeps a single api-key auth path.
  notarize: true
linux:
  target: AppImage
  category: Development
  icon: build/icon.png
# oneClick (per-user, no elevation) is MANDATORY: the assisted installer
# (oneClick:false) crashes with an access violation (0xC0000005) in NSIS's
# bundled 2018-era System.dll at the elevation / "for everyone vs just me"
# step — the window dies right after the mode choice and installs nothing.
# Reproduced deterministically on the sibling racconsole app; perMachine:false
# installs to %LOCALAPPDATA% with no elevation, which is also the right model
# for a per-user dev tool that reads the current user's ~/.claude and ~/.config.
nsis:
  oneClick: true
  perMachine: false
  # No spaces in the artifact name. electron-builder's default
  # (`${productName} Setup ${version}.${ext}`) produces "SeniorDev Setup 0.5.2.exe",
  # which GitHub rewrites to "SeniorDev.Setup.0.5.2.exe" on upload — while latest.yml
  # keeps pointing at "SeniorDev-Setup-0.5.2.exe". Naming it this way makes the
  # published asset and the update feed agree by construction.
  artifactName: ${productName}-Setup-${version}.${ext}
